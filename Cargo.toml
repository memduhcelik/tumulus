[package]
name = "tumulus"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "JSON processor"
repository = "https://github.com/memduhcelik/tumulus"

# Tests compare every case with jq. Optimized code keeps the deep cases
# fast, and leaving debug info out keeps each short process cheap to start.
[profile.test]
opt-level = 3
debug = 0

# jq's patterns are Oniguruma's Perl NG syntax. `generate` would run
# bindgen, so the published bindings are used instead. The `l` flag is the
# longest match on Oniguruma 6.9.5 and on 6.9.9, so the library is not
# frozen at 6.9.5.
[dependencies]
onig = { version = "6.5.3", default-features = false }
onig_sys = { version = "69.9.3", default-features = false }
