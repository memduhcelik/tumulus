[package]
name = "tumulus"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "JSON processor"
repository = "https://github.com/memduhcelik/tumulus"

# Tests compare every case with jq. Optimized code keeps the deep cases
# fast, and leaving debug info out keeps each short process cheap to start.
[profile.test]
opt-level = 3
debug = 0

# jq's patterns are Oniguruma's Perl NG syntax. 6.9.5 still searches for the
# longest alternative; later releases return the first one. `generate` would
# run bindgen, so the published bindings are used instead. `onig_sys` is pinned
# so a later update does not replace that library.
[dependencies]
onig = { version = "=6.1.0", default-features = false }
onig_sys = { version = "=69.5.1", default-features = false }
