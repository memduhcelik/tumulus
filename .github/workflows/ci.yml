name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install date locales
        run: bash scripts/install-date-locales.sh
      - name: Compare tumulus with jq
        run: |
          jq --version
          cargo test --locked

  parity-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install date locales
        run: bash scripts/install-date-locales.sh
      - name: Compare tumulus with jq
        # Homebrew jq is earlier on PATH. The comparison is the system jq.
        run: |
          export PATH="/usr/bin:${PATH}"
          test "$(command -v jq)" = /usr/bin/jq
          jq --version
          cargo test --locked
